---
# @meta:
# {
#   "description": "Change SSH password on target hosts using multi-level fallback strategy: Ansible user module -> chpasswd -> passwd --stdin.",
#   "author": "tsc_ansible_mcp",
#   "version": "1.0.0",
#   "parameters": [
#     {"name": "new_password", "type": "string", "required": true, "description": "New SSH password for root user"}
#   ],
#   "use_cases": ["Change SSH password on multiple hosts safely with automatic fallback"],
#   "notes": ["Requires root access on target hosts", "Password must meet complexity requirements"]
# }

- name: Change SSH password on target hosts with multi-level fallback
  hosts: all
  gather_facts: false
  serial: 50
  vars:
    python_path: "/home/tsc/tsc_tools/micromamba/envs/tsc_python/bin/python3"
    fallback_script_dest: "/tmp/change_ssh_password_fallback.py"
  tasks:
    - name: Attempt password change using Ansible user module
      ansible.builtin.user:
        name: root
        password: "{{ new_password | password_hash('sha512') }}"
        update_password: always
      register: user_module_result
      ignore_errors: true

    - name: Upload fallback Python script if user module failed
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env python3
          """Fallback password change script.

          Tries chpasswd first, then falls back to passwd --stdin.
          """
          import argparse
          import subprocess
          import sys
          from typing import Tuple

          def change_with_chpasswd(password: str) -> Tuple[bool, str]:
              """Change password using chpasswd command.

              Args:
                  password: New password for root user.

              Returns:
                  Tuple of (success, error_message).
              """
              cmd = f"echo 'root:{password}' | chpasswd"
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              if result.returncode != 0:
                  return False, result.stderr.strip()
              return True, ""

          def change_with_passwd_stdin(password: str) -> Tuple[bool, str]:
              """Change password using passwd --stdin command.

              Args:
                  password: New password for root user.

              Returns:
                  Tuple of (success, error_message).
              """
              cmd = f"echo '{password}' | passwd --stdin root"
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              if result.returncode != 0:
                  return False, result.stderr.strip()
              return True, ""

          def main() -> None:
              """Main entry point for fallback password change."""
              parser = argparse.ArgumentParser(description="Fallback password change")
              parser.add_argument("--new-password", type=str, required=True)
              args = parser.parse_args()

              new_password = args.new_password

              ok, err = change_with_chpasswd(new_password)
              if ok:
                  print("SUCCESS: chpasswd succeeded")
                  sys.exit(0)

              ok2, err2 = change_with_passwd_stdin(new_password)
              if ok2:
                  print("SUCCESS: passwd --stdin succeeded")
                  sys.exit(0)

              print(
                  f"FAILED: chpasswd error={err}, passwd --stdin error={err2}",
                  file=sys.stderr,
              )
              sys.exit(1)

          if __name__ == "__main__":
              main()
        dest: "{{ fallback_script_dest }}"
        mode: "0755"
      when: user_module_result is failed

    - name: Execute fallback script if user module failed
      ansible.builtin.raw: |
        {{ python_path }} {{ fallback_script_dest }} --new-password '{{ new_password }}'
      register: fallback_result
      changed_when: fallback_result.rc == 0
      failed_when: fallback_result.rc != 0
      when: user_module_result is failed

    - name: Set final result
      ansible.builtin.set_fact:
        change_result: "{{ fallback_result | default(user_module_result) }}"

    - name: Display result
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }}: {{ change_result.stdout | default('') }} {{ change_result.stderr | default('') }}"
      when: change_result is defined
