---
- name: Change SSHD port and/or root password on target hosts
  hosts: all
  gather_facts: false
  serial: 1

  tasks:
    - name: Normalize host configuration from extravars
      ansible.builtin.set_fact:
        host_config: "{{ {'host': inventory_hostname} | combine((new_port | default(None) is none) | ternary({}, {'new_port': new_port})) | combine((root_password | default(None) is none) | ternary({}, {'root_password': root_password})) }}"

    - name: Validate at least one action specified
      ansible.builtin.fail:
        msg: "At least one of new_port or root_password must be specified for host {{ inventory_hostname }}"
      when: >
        (host_config.new_port is not defined or host_config.new_port | length == 0) and
        (host_config.root_password is not defined or host_config.root_password | length == 0)

    - name: Validate password strength
      ansible.builtin.shell:
        cmd: >
          python3 /home/workspace/tsc_ansible_mcp/playbooks/validate_password.py '{{ host_config.root_password | quote }}'
      register: password_check
      changed_when: false
      failed_when: password_check.rc != 0
      when: host_config.root_password is defined and host_config.root_password is not none
      delegate_to: localhost

    - name: Get current timestamp
      ansible.builtin.shell:
        cmd: date +%s
      register: timestamp_result
      changed_when: false

    - name: Backup current sshd_config
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "/etc/ssh/sshd_config.bak_{{ timestamp_result.stdout }}"
        remote_src: true
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Set backup path fact
      ansible.builtin.set_fact:
        sshd_backup: "/etc/ssh/sshd_config.bak_{{ timestamp_result.stdout }}"
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Remove all existing Port lines
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*#?\s*Port\s'
        state: absent
      loop: "{{ range(0, 10) | list }}"
      changed_when: false
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Set SSHD port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Port {{ host_config.new_port }}"
        insertbefore: BOF
        backup: true
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Validate sshd configuration
      ansible.builtin.shell:
        cmd: /usr/sbin/sshd -t
      register: sshd_test
      changed_when: false
      failed_when: sshd_test.rc != 0
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Rollback if configuration invalid
      ansible.builtin.shell:
        cmd: |-
          cp {{ sshd_backup }} /etc/ssh/sshd_config
          systemctl reload sshd
        executable: /bin/bash
      when: host_config.new_port is defined and host_config.new_port is not none and sshd_test.rc | default(0) != 0
      changed_when: false

    - name: Fail if configuration invalid
      ansible.builtin.fail:
        msg: "sshd configuration test failed: {{ sshd_test.stderr | default('unknown error') }}"
      when: host_config.new_port is defined and host_config.new_port is not none and sshd_test.rc | default(0) != 0

    - name: Reload SSHD service
      ansible.builtin.systemd:
        name: sshd
        state: reloaded
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Wait for SSHD to start
      ansible.builtin.wait_for:
        port: "{{ host_config.new_port }}"
        timeout: 15
        delay: 2
      when: host_config.new_port is defined and host_config.new_port is not none

    - name: Change root password
      ansible.builtin.user:
        name: root
        password: "{{ host_config.root_password | password_hash('sha512') }}"
      when: host_config.root_password is defined and host_config.root_password is not none

    - name: Ping target host
      ansible.builtin.ping:

    - name: Get old password from inventory
      ansible.builtin.shell:
        cmd: python3 /home/workspace/tsc_ansible_mcp/bin/inventory.py list 2>&1 | grep -A1000 '^{'
      delegate_to: localhost
      connection: local
      register: inventory_list
      changed_when: false

    - name: Extract old password
      ansible.builtin.set_fact:
        old_password: "{{ (inventory_list.stdout | from_json)[inventory_hostname].get('ansible_password') | default(omit) }}"

    - name: Update local inventory with new port and password
      ansible.builtin.shell:
        cmd: >
          python3 /home/workspace/tsc_ansible_mcp/bin/inventory.py update
          --host {{ inventory_hostname }}
          {% if host_config.new_port is defined and host_config.new_port is not none %}
          --port {{ host_config.new_port }}
          {% endif %}
          {% if host_config.root_password is defined and host_config.root_password is not none %}
          --password {{ host_config.root_password | quote }}
          {% endif %}
          {% if old_password is defined and old_password is not none %}
          --old-password {{ old_password | quote }}
          {% endif %}
        executable: /bin/bash
      delegate_to: localhost
      connection: local
      changed_when: false
      when: >
        (host_config.new_port is defined and host_config.new_port is not none) or
        (host_config.root_password is defined and host_config.root_password is not none)
