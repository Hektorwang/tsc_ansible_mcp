# TSC_ANSIBLE_MCP 配置文件
[tsc_repo]
local_path = "/home/workspace/tsc_ansible_mcp/tsc_install"

[auth]
enabled = false
jwt_issued_tokens_file = "etc/jwt_issued_tokens.json"
jwt_secret_key_file = "etc/jwt_secret_key.txt"

[auth.tool_permissions]
admin = ["*"]
user = ["get_task_status", "playbook_*"]

[debug]
enabled = true
cache_dir = "logs/debug"

[mcp]
default_timeout = 600
host = "192.168.3.252"
max_timeout = 3600
mcp_version = "1.13.0"
path = "/mcp"
port = 8500
transport = "http"

# 安装包 URL 模板（支持变量: {version}, {distro}, {arch}, {date}）
tsc_python_url_template = "/tsc_python-{version}-{distro}-{arch}-{date}.sh"
tsc_tools_url_template = "/tsc_tools-{version}-noarch-{date}.sh"

[normalization.architecture]
aarch64 = "aarch64"
amd64 = "x86_64"
arm64 = "aarch64"
x86_64 = "x86_64"

[normalization.distribution]
almalinux = "RedHat"
alpine = "Alpine"
arch = "Arch"
centos = "RedHat"
debian = "Debian"
fedora = "RedHat"
fitserveros = "Euler"
fitstarryskyos = "Euler"
hce = "Euler"
linuxmint = "Debian"
manjaro = "Arch"
ningos = "Euler"
openeuler = "Euler"
opensuse = "Suse"
rhel = "RedHat"
rocky = "RedHat"
suse = "Suse"
ubuntu = "Debian"

[ansible]
high_risk_commands = ["rm", "unlink", "halt", "shutdown", "mkfs", "parted", "reboot", "poweroff", "init", "dd", "format", "wipefs", "eval", "drop"]

[execution]
forks = 10
max_failed_detail = 10
max_output_length = 1000
result_store_dir = "logs/task_results"
serial = 10
timeout = 300

[playbooks]
path = "playbooks"

[logging]
ansible_execution_enabled = true
ansible_execution_log = "ansible_execution.log"
ansible_execution_retention = "30 days"
ansible_execution_rotation = "50 MB"
dir = "logs"
level = "DEBUG"

[ssh]
base_args = "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardX11=no -o GSSAPIAuthentication=no -o VerifyHostKeyDNS=no -o ControlMaster=auto -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ControlPersist=60 -o ConnectTimeout=30"
password_args = "-o PreferredAuthentications=password -o PubkeyAuthentication=no"
